server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Service worker & manifest tidak boleh di-cache lama oleh browser/proxy,
    # supaya update PWA terdeteksi cepat.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: semua route (/, /login, /dashboard) dilayani index.html,
    # React Router yang urus routing di sisi client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
